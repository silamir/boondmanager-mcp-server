name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        # Prettier is version-locked, one runtime is enough. Fails on any file
        # `npm run format` would rewrite (issue #244: five files had drifted
        # because nothing in CI ever ran this).
        if: matrix.node-version == 22
        run: npm run format:check

      - name: Audit production dependencies
        # Dev-only advisories are noise for a published server; a high/critical
        # advisory on a runtime dependency blocks the merge.
        if: matrix.node-version == 22
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      # Before the tests: src/stdio-stdout.test.ts spawns dist/index.js.
      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:coverage

      - name: Validate MCPB manifest
        if: matrix.node-version == 22
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate .

      - name: Check tool catalogue is up to date
        # If a tool/prompt/resource was added or renamed, TOOLS.md must be
        # regenerated and committed. This step fails if it drifts.
        if: matrix.node-version == 22
        run: node scripts/generate-tools-catalog.mjs --check

      - name: Check Claude Code plugin manifests are up to date
        # plugin.json + .mcp.json are generated from manifest.json (single
        # source of truth for the 14 user_config options). This step fails if
        # they drift, same contract as the TOOLS.md check above.
        if: matrix.node-version == 22
        run: node scripts/generate-plugin-manifest.mjs --check

      - name: Verify version consistency
        if: matrix.node-version == 22
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          SERVER_VERSION=$(node -p "require('./server.json').version")
          GEMINI_VERSION=$(node -p "require('./gemini-extension.json').version")
          PLUGIN_VERSION=$(node -p "require('./plugins/boondmanager-mcp/.claude-plugin/plugin.json').version")
          MARKETPLACE_VERSION=$(node -p "require('./.claude-plugin/marketplace.json').plugins.find(p => p.name === 'boondmanager-mcp').version")
          # The npm pin the plugin launches. This is the copy that fossilises
          # silently: a stale pin keeps installing an old release forever, with
          # nothing in the plugin UI hinting that it is not the announced version.
          PLUGIN_NPM_PIN=$(node -p "require('./plugins/boondmanager-mcp/.mcp.json').mcpServers.boondmanager.args.at(-1).split('@').at(-1)")
          # Same fossilisation risk one level down, in the MCP Registry manifest:
          # `server.json.version` is checked above, but the entries under
          # `packages[]` are what a registry client actually installs. A stale
          # npm pin there hands users an old server while every visible version
          # string says otherwise -- which is how issue #217 (a draft-07 $schema
          # fixed in 2.12.2) can still be reported against a current release.
          SERVER_NPM_PIN=$(node -p "require('./server.json').packages.find(p => p.registryType === 'npm').version")
          SERVER_MCPB_PIN=$(node -p "(require('./server.json').packages.find(p => p.registryType === 'mcpb').identifier.match(/\\/v([^/]+)\\//) || [])[1]")
          echo "package.json:          $PKG_VERSION"
          echo "manifest.json:         $MANIFEST_VERSION"
          echo "server.json:           $SERVER_VERSION"
          echo "gemini-extension.json: $GEMINI_VERSION"
          echo "plugin.json:           $PLUGIN_VERSION"
          echo "marketplace.json:      $MARKETPLACE_VERSION"
          echo "plugin npm pin:        $PLUGIN_NPM_PIN"
          echo "server.json npm pin:   $SERVER_NPM_PIN"
          echo "server.json mcpb pin:  $SERVER_MCPB_PIN"
          FAILED=0
          for pair in \
            "manifest.json:$MANIFEST_VERSION" \
            "server.json:$SERVER_VERSION" \
            "gemini-extension.json:$GEMINI_VERSION" \
            "plugin.json:$PLUGIN_VERSION" \
            "marketplace.json:$MARKETPLACE_VERSION" \
            "plugin npm pin:$PLUGIN_NPM_PIN" \
            "server.json npm pin:$SERVER_NPM_PIN" \
            "server.json mcpb pin:$SERVER_MCPB_PIN"; do
            name="${pair%:*}"
            value="${pair##*:}"
            if [ "$value" != "$PKG_VERSION" ]; then
              echo "ERROR: $name is $value, expected $PKG_VERSION (package.json)"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "Bump every version copy together — see CLAUDE.md §Releasing step 2."
            exit 1
          fi

      - name: Upload coverage
        if: matrix.node-version == 22
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage/

  docker-build:
    name: Docker image builds
    # The Dockerfile used to be exercised only by the release workflow, so a PR
    # could break the image (a moved file, a dropped dependency) and nobody saw
    # it until the tag. Build without pushing, single platform: the multi-arch
    # matrix and the registries stay in release.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: boondmanager-mcp-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke the image (/healthz)
        run: |
          docker run -d --name mcp -p 3000:3000 boondmanager-mcp-server:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/healthz; then echo; docker rm -f mcp; exit 0; fi
            sleep 1
          done
          echo "::error::/healthz never answered"; docker logs mcp; docker rm -f mcp; exit 1

  tools-list-size:
    name: tools/list payload size
    # Every byte of `tools/list` is paid on every turn of every conversation.
    # The unit tests cap the icons' share; this job measures the whole payload
    # as a real stdio client receives it, fails above MAX_TOOLS_LIST_KIB, and
    # posts the delta against the base branch on the PR so growth is a visible
    # line-item of the review rather than a surprise at release time.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # Raise this consciously, in the PR that crosses it, with the reason in
      # its description. 382 KiB on 2026-09-26 (185 tools); raised to 560 the
      # same day by #254 (223 tools, ~480 KiB) with #256 (233 tools, ~500 KiB)
      # right behind — the 2026-09-25 audit adds ~50 tools on purpose, and
      # operators who need less have BOOND_MCP_PROFILE / BOOND_MCP_ICONS=0.
      MAX_TOOLS_LIST_KIB: 560
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: "npm"

      - name: Build and measure this revision
        run: |
          npm ci
          npm run build
          node scripts/measure-tools-list.mjs --json > /tmp/head.json
          node scripts/measure-tools-list.mjs --max-kib "$MAX_TOOLS_LIST_KIB"

      - name: Build and measure the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git worktree add /tmp/base "origin/$BASE_REF"
          cd /tmp/base
          npm ci
          npm run build
          # The measurement script of THIS revision, so a change to the script
          # itself cannot skew the comparison.
          node "$GITHUB_WORKSPACE/scripts/measure-tools-list.mjs" --json > /tmp/base.json || echo '{}' > /tmp/base.json

      - name: Render the comparison
        run: |
          if [ -s /tmp/base.json ] && [ "$(cat /tmp/base.json)" != "{}" ]; then
            node scripts/measure-tools-list.mjs --compare /tmp/base.json --markdown | tee /tmp/comment.md
          else
            node scripts/measure-tools-list.mjs --markdown | tee /tmp/comment.md
          fi
          cat /tmp/comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR (sticky)
        # Forks get a read-only token: the summary above still carries the
        # figures, the comment is best-effort.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          MARKER='<!-- tools-list-size -->'
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)
          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/$EXISTING" -F body=@/tmp/comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file /tmp/comment.md
          fi
